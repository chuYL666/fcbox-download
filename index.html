<script>
/* 微信内置浏览器（X5 / WKWebView）会把整页 HTML 缓存很久，发版后经常还是旧页面。
   这里比对线上 build.json：和上次看到的构建号不同，就带 _b= 参数重载一次强制回源。
   只在本页已经有 JS 时执行，失败静默（断网、隐私模式都不影响正常浏览）。 */
(function () {
  var KEY = 'fcbox.site.build';
  try {
    var x = new XMLHttpRequest();
    x.open('GET', './build.json?t=' + String(new Date().getTime()), true);
    x.onreadystatechange = function () {
      if (x.readyState !== 4) return;
      if (x.status !== 200) return;
      var b;
      try { b = JSON.parse(x.responseText).build; } catch (e) { return; }
      if (!b) return;
      var seen = null;
      try { seen = localStorage.getItem(KEY); } catch (e) {}
      if (seen === b) return;
      try { localStorage.setItem(KEY, b); } catch (e) {}
      if (!seen) return;                       /* 第一次来，不用重载 */
      var href = location.href.replace(/([?&])_b=[^&#]*/g, '$1').replace(/[?&]$/, '');
      var sep = href.indexOf('?') < 0 ? '?' : '&';
      location.replace(href + sep + '_b=' + encodeURIComponent(b));
    };
    x.send();
  } catch (e) {}
})();
</script>
